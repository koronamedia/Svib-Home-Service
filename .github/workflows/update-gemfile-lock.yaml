name: update-gemfile-lock

# Manually triggered workflow that regenerates Gemfile.lock inside the
# zammad-ci container (which has Ruby + Bundler already installed) and
# commits the result back to the branch the run was started against.
#
# Use this after adding/removing a gem in Gemfile on a machine where
# Ruby/Bundler is not available (e.g. the Windows development host).
#
# After a green run, open a pull request so docker-ci.yaml verifies the
# full image build (bundler + Sprockets + Vite + container smoke test).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update Gemfile.lock on"
        required: true
        type: string
        default: "codex/dispatch-pwa-web-push"

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    container:
      image: zammad/zammad-ci:latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Load RVM and regenerate Gemfile.lock
        shell: bash
        run: |
          set -o errexit
          set -o pipefail

          # shellcheck disable=SC1091
          source /etc/profile.d/rvm.sh

          # Print bundler/ruby versions for debugging resolution failures.
          ruby -v
          bundle -v

          # Drop into deployment-off mode so Bundler is allowed to mutate the
          # lockfile (deployment implies --frozen which blocks resolution).
          bundle config unset deployment

          # Regenerate the lockfile. We update web-push and jwt because
          # web-push 3.x requires jwt ~> 3.0 while the current lock pins
          # jwt 2.10.x. Bundler will resolve a compatible set and write the
          # lock without installing the gems.
          bundle lock --update web-push jwt

      - name: Show lockfile diff
        shell: bash
        run: git diff -- Gemfile.lock || true

      - name: Commit updated Gemfile.lock
        shell: bash
        run: |
          if git diff --quiet -- Gemfile.lock; then
            echo "Gemfile.lock is already up to date. Nothing to commit."
            exit 0
          fi

          git add Gemfile.lock
          git commit -m "chore(deps): update Gemfile.lock for web-push gem

          Regenerated by the update-gemfile-lock workflow after adding
          the web-push gem to Gemfile."

          git push origin "${{ inputs.branch }}"
